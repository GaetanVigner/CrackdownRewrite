# Manual analysis fixes for Crackdown (default.xex, title 4D5307DC).

[functions]
# Branch targets the analyzer does not reach; codegen Validate fails without them.
0x8252FD70 = {}
0x82357EE8 = {}
0x8247FF30 = {}
0x82516A88 = {}
0x8252E050 = {}
0x825322D8 = {}
0x82A1DD18 = {}
0x823F0668 = {}

# The rendezvous spin in sub_82A50000 (audio workers) has no kernel wait, so title termination cannot stop it.
[[midasm_hook]]
address = 0x82A500DC
name = "crackdown_audio_barrier_escape"
registers = []
after_instruction = false
return_on_true = true

# Caps the Massive title-server count in sub_82AA0920 at its 10-record stack array before the loop reads it.
[[midasm_hook]]
address = 0x82AA0A6C
name = "crackdown_massive_server_count_guard"
registers = ["r1"]
after_instruction = false

# Keeps the 360x256 audio bit-grid reads of sub_82252150 near their table at 0x82D33F98: a NaN angle converts to
# 0x80000000 and the read faulted at 0x72D32F98 (r11, r10 columns; r27, r29 rows). Spans near the table are untouched.
[[midasm_hook]]
address = 0x822541D8
name = "crackdown_visibility_grid_guard"
registers = ["r11", "r10", "r27", "r29"]
after_instruction = false

# The ledge and slope follower sub_822B4D40 divides its snap-down pull by the step's dt; above 30 FPS that velocity runs
# away on slopes. The pull is scaled so it is divided by the title's 1/30 s step instead (f0 = clamp(h,0,2) * 0.4).
[[midasm_hook]]
address = 0x822B5634
name = "crackdown_ledge_snap_down"
registers = ["f0"]
after_instruction = false

# The character's vertical visual smoothing in sub_822A2C90 decays its blend (f13, before `fmuls f0,f0,f13`) and moves a
# fraction of the gap (f13, after `fmuls f13,f13,f0`) once per step; both become per-second above 30 FPS.
[[midasm_hook]]
address = 0x822A2DB8
name = "crackdown_ground_snap_decay"
registers = ["f13"]
after_instruction = false

[[midasm_hook]]
address = 0x822A2E28
name = "crackdown_ground_snap_lerp"
registers = ["f13"]
after_instruction = true

# The first gravity increment after a grounded step (f13 = accumulator +532 == 0) is the 30 FPS one, so settling onto
# the floor and sliding off steep faces keep their 30 FPS speed (f0 = gravity * dt after the multiply).
[[midasm_hook]]
address = 0x822AA8F4
name = "crackdown_first_gravity_step"
registers = ["f0", "f13"]
after_instruction = true

# A ragdoll started again on a character already ragdolled gets body velocities from a stale pose pair over the 30 FPS
# step instead of one short step (f1 = dt, r29 = character), not 4x the shipped speeds at 120 FPS.
[[midasm_hook]]
address = 0x822BA2E8
name = "crackdown_ragdoll_pose_dt"
registers = ["f1", "r29"]
after_instruction = false

# Projectiles detect impacts only with a ray of launch velocity * dt (the float at r1+476); it keeps its 30 FPS length
# so Havok contact does not stop a rocket before the ray reaches the surface.
[[midasm_hook]]
address = 0x823672B0
name = "crackdown_projectile_probe_dt"
registers = ["r1"]
after_instruction = false

# The camera's above-water push divides the depth by its forward axis's y (f13); a level camera made it infinite.
[[midasm_hook]]
address = 0x8228FDDC
name = "crackdown_camera_lift_divisor"
registers = ["f13"]
after_instruction = false

# Windows counted in frame-counter ticks (one per update) keep their 30 FPS length in real time: the hit-reaction merge
# window (r11 = counter + 10) and a ragdoll threshold (r10 = counter + 15).
[[midasm_hook]]
address = 0x822E191C
name = "crackdown_hit_merge_window"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x822BA48C
name = "crackdown_ragdoll_tick_window"
registers = ["r10"]
after_instruction = true

# After a ragdoll the head look-at target and the audio listener built from the head data can go NaN; a non-finite
# listener (r3 matrix, r4 vector) is replaced by the last finite one, a non-finite target (r31 + 0x13B0) by the
# character's position.
[[midasm_hook]]
address = 0x82252134
name = "crackdown_audio_listener_guard"
registers = ["r3", "r4"]
after_instruction = false

[[midasm_hook]]
address = 0x822A026C
name = "crackdown_look_target_guard"
registers = ["r31"]
after_instruction = false

[[midasm_hook]]
address = 0x822A2C50
name = "crackdown_look_target_guard"
registers = ["r31"]
after_instruction = false

# Sanitizes the mixed frame before XAudioSubmitRenderDriverFrame in sub_82A4BEF8; r4 is the frame address.
[[midasm_hook]]
address = 0x82A4BF40
name = "crackdown_audio_pcm_firewall"
registers = ["r4"]
after_instruction = false

# The wave safety timeout in sub_8225B0A8 adds one per update (`addi r11,r11,1`); it advances at 30 Hz at any frame rate.
[[midasm_hook]]
address = 0x8225B254
name = "crackdown_audio_wave_timeout_tick"
registers = ["r11", "r30"]
after_instruction = true

# The variable-step frame time (`li rN,16` where the fixed step would take 33 ms) follows the selected frame rate.
[[midasm_hook]]
address = 0x82287194
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x82388E98
name = "crackdown_variable_step_frame_ms"
registers = ["r9"]
after_instruction = true

[[midasm_hook]]
address = 0x823F0ED8
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x8248F278
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x824F9D1C
name = "crackdown_variable_step_frame_ms"
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
address = 0x824FB408
name = "crackdown_variable_step_frame_ms"
registers = ["r10"]
after_instruction = true

[[midasm_hook]]
address = 0x82505EF4
name = "crackdown_variable_step_frame_ms"
registers = ["r9"]
after_instruction = true

[[midasm_hook]]
address = 0x8257AB0C
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x8259A3CC
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x825E1230
name = "crackdown_variable_step_frame_ms"
registers = ["r27"]
after_instruction = true

[[midasm_hook]]
address = 0x8265178C
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
address = 0x826517F0
name = "crackdown_variable_step_frame_ms"
registers = ["r11"]
after_instruction = true

[[midasm_hook]]
